[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradresidual"
version = "0.1.0"
description = "Gradient residual connections on a synthetic sine-regression benchmark"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gradresidual_train = "gradresidual.run.train:main"
gradresidual_analyze = "gradresidual.run.analyze:main"

[tool.setuptools.packages.find]
include = ["gradresidual*"]
